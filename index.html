<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Rick and Morty Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

        <h1>Rick and Morty Explorer</h1>

        <div id="character-image">
            <img 
                id="characterImg" 
                src="" 
                alt="Imagine personaj Rick and Morty"
            >
        </div>

        <table id="character-details" border="1">
            <tbody>
                <tr>
                    <th>Status</th>
                    <td id="status">-</td>
                </tr>
                <tr>
                    <th>Specie</th>
                    <td id="species">-</td>
                </tr>
                <tr>
                    <th>Gen</th>
                    <td id="gender">-</td>
                </tr>
            </tbody>
        </table>

        
        <button id="getCharacterBtn">Get Character</button>

    </div>
<script src="script.js"></script>
</body>
</html>
